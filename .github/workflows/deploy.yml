name: Deploy to GitHub Pages and InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Online server address, e.g. wss://play.example.com/mp. Set it in the repo under
      # Settings > Secrets and variables > Actions > Variables > MP_SERVER_URL.
      # While it's unset, the ONLINE button shows as NOT AVAILABLE on GitHub Pages and InfinityFree.
      VITE_MP_SERVER: ${{ vars.MP_SERVER_URL }}
      # Name players see for that server, e.g. NEW YORK (repo variable MP_SERVER_NAME).
      VITE_MP_SERVER_NAME: ${{ vars.MP_SERVER_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build

      - name: Show GitHub Pages build output
        run: find dist -type f -print

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Build for InfinityFree
        run: INFINITYFREE=true npm run build

      - name: Show InfinityFree build output
        run: find dist -type f -print

      - name: Look up InfinityFree FTP address
        id: ftp_host
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [[ "$FTP_SERVER" =~ ^[0-9.]+$ ]]; then exit 0; fi
          for attempt in $(seq 1 10); do
            for resolver in 8.8.8.8 1.1.1.1 9.9.9.9; do
              ip=$(dig +short +time=3 +tries=1 "@$resolver" "$FTP_SERVER" A | grep -E '^[0-9.]+$' | tail -n 1)
              if [ -n "$ip" ]; then
                echo "$ip $FTP_SERVER" | sudo tee -a /etc/hosts > /dev/null
                echo "Found the FTP address on try $attempt"
                exit 0
              fi
            done
            sleep 6
          done
          echo "::warning::Couldn't look up the InfinityFree FTP address"
          exit 1

      - name: FTP Deploy to InfinityFree
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /htdocs/

      - name: Wait before retrying FTP
        if: steps.ftp.outcome == 'failure'
        run: sleep 30

      - name: FTP Deploy to InfinityFree (retry)
        if: steps.ftp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /htdocs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4